name: Lint Markdown Files

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Markdown Linting
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
